# ==============================================================================
# Evaluator Mapping System (EMS) - Backend Application Configuration
# Production-ready with Environment Variable Ingestion for Render / Cloud
# ==============================================================================

# Server Port (Render automatically sets the PORT environment variable)
server.port=${PORT:8080}

# MySQL Database Configuration
# In Render Dashboard -> Environment:
# Set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:evaluator_mapping_db}?sslMode=REQUIRED&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:10MB}

# JWT Security Configuration
# In Render Dashboard -> Environment: Set JWT_SECRET to a secure random string
jwt.secret=${JWT_SECRET:evaluator-mapping-system-secret-key-for-jwt-token-generation-2024}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS Allowed Origins (Vercel Frontend + Localhost)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://evalign-six.vercel.app,http://localhost:4200}
