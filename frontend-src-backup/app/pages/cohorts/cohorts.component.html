<div class="page-container">
  <div class="page-header">
    <h2>Cohorts</h2>
    <div class="header-actions">
      <input type="text" placeholder="Search cohorts..." [(ngModel)]="searchTerm" (ngModelChange)="onSearch()" class="search-input">
      <select [(ngModel)]="statusFilter" (ngModelChange)="onSearch()" class="filter-select">
        <option value="All">All Statuses</option>
        <option value="Active">Active</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
        <option value="Not Started">Not Started</option>
      </select>
      <button class="btn-primary" (click)="openNewCohortModal()">+ New Cohort</button>
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Cohort Name</th>
          <th>Batch Code</th>
          <th>Candidates</th>
          <th>Evaluators Mapped</th>
          <th>Start Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cohort of cohorts" (click)="openMapping(cohort.id)" class="clickable-row">
          <td class="primary-text">{{ cohort.name }}</td>
          <td>{{ cohort.batchCode }}</td>
          <td>{{ cohort.candidateCount }}</td>
          <td>{{ cohort.evaluatorsMapped }}/{{ cohort.evaluatorsTotal }}</td>
          <td>{{ cohort.startDate | date }}</td>
          <td><span class="badge" [ngClass]="getStatusClass(cohort.status)">{{ cohort.status }}</span></td>
        </tr>
        <tr *ngIf="cohorts.length === 0">
          <td colspan="6" class="text-center empty-state">No cohorts found.</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" *ngIf="showModal">
  <div class="modal">
    <div class="modal-header">
      <h3>Create New Cohort</h3>
      <button class="close-btn" (click)="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>Cohort Name</label>
        <input type="text" [(ngModel)]="newCohort.name" placeholder="e.g. Summer Engineering 2024">
      </div>
      <div class="form-group">
        <label>Batch Code</label>
        <input type="text" [(ngModel)]="newCohort.batchCode" placeholder="e.g. SE-24">
      </div>
      <div class="form-group">
        <label>Start Date</label>
        <input type="date" [(ngModel)]="newCohort.startDate">
      </div>
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="newCohort.status">
          <option value="Not Started">Not Started</option>
          <option value="Active">Active</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" (click)="closeModal()">Cancel</button>
      <button class="btn-primary" (click)="saveCohort()" [disabled]="!newCohort.name || !newCohort.batchCode">Save</button>
    </div>
  </div>
</div>
